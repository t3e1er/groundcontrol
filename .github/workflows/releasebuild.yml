name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────
  # 1. Gate: Full validation suite before building
  # ──────────────────────────────────────────────────
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' Cargo.toml | head -n1 | sed -E 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "Release Tag: ${GITHUB_REF_NAME} (parsed: ${TAG_VERSION})"
          echo "Cargo.toml:  ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match Cargo.toml workspace version '${CARGO_VERSION}' (expected tag 'v${CARGO_VERSION}')."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: releasebuild-validate

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: ctxvault-model-${{ hashFiles('scripts/fetch-model.sh') }}

      - name: Fetch embedding model (sidecar)
        run: bash scripts/fetch-model.sh ./models

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test suite
        env:
          CTX_MODELS_DIR: ${{ github.workspace }}/models
        run: cargo test --workspace --all-features --locked

      - name: Documentation check
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: License & advisory check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ──────────────────────────────────────────────────
  # 2. Build & Package Across OS Platforms
  # ──────────────────────────────────────────────────
  build-release:
    name: Build (${{ matrix.target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: ctxvault.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            binary_name: ctxvault
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary_name: ctxvault
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: ctxvault

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for Linux ARM64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Fetch the embedding model so it can be shipped as a sidecar next to the
      # binary in each platform archive (<archive>/models/<model>/...). bash is
      # available on all GitHub runners including Windows (Git Bash).
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: ctxvault-model-${{ hashFiles('scripts/fetch-model.sh') }}

      - name: Fetch embedding model (sidecar)
        shell: bash
        run: bash scripts/fetch-model.sh ./models

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} --bin ctxvault
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin ctxvault
          fi

      - name: Package artifacts (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGING="ctxvault-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGING/"
          cp README.md LICENSE THIRD_PARTY_LICENSES.md "$STAGING/" 2>/dev/null || true
          cp -r examples "$STAGING/" 2>/dev/null || true
          # Sidecar: ship the embedding model next to the binary (<binary>/models/<model>/...).
          cp -r models "$STAGING/"
          tar -czvf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET_NAME=$STAGING.tar.gz" >> $GITHUB_ENV

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "ctxvault-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $staging
          if (Test-Path README.md) { Copy-Item README.md -Destination $staging }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $staging }
          if (Test-Path THIRD_PARTY_LICENSES.md) { Copy-Item THIRD_PARTY_LICENSES.md -Destination $staging }
          if (Test-Path examples) { Copy-Item -Recurse examples -Destination $staging }
          # Sidecar: ship the embedding model next to the binary (<binary>\models\<model>\...).
          if (Test-Path models) { Copy-Item -Recurse models -Destination $staging }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip" -Force
          echo "ASSET_NAME=$staging.zip" >> $env:GITHUB_ENV

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET_NAME }}

  # ──────────────────────────────────────────────────
  # 3. Publish to GitHub Releases (Step 4.1)
  # ──────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
