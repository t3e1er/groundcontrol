[workspace]
resolver = "2"
members = [
    "crates/groundcontrol-core",
    "crates/groundcontrol-mcp",
    "crates/groundcontrol-cli",
    "crates/groundcontrol-common",
    "crates/groundcontrol-graphview",
    "crates/groundcontrol-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/t3e1er/groundcontrol"
authors = ["Trent <trent@example.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "allow", priority = -1 }
style = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
crossbeam-channel = "0.5"
sysinfo = "0.39"
rayon = "1.12"


# MCP protocol
# rmcp = "0.1"  # uncomment when adding MCP integration

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
bytemuck = { version = "1.21", features = ["derive"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Markdown parsing
pulldown-cmark = "0.13"

# Full-text search (BM25)
tantivy = "0.26"

# Vector search
hnsw_rs = "0.3"

# Embeddings (Hardware-Accelerated via DirectML / CoreML / CUDA / CPU)
ort = { version = "2.0.0-rc.13", features = ["copy-dylibs", "download-binaries"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Knowledge graph
petgraph = { version = "0.8", features = ["serde-1"] }

# Database
rusqlite = { version = "0.40", features = ["bundled", "backup"] }

# File watching / locking / filtering
notify = "8.2"
notify-debouncer-full = "0.7"
fs4 = "0.13"
ignore = "0.4"

# Compression & Archiving
tar = "0.4"
zstd = "0.14"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Document Extraction (Pure Rust)
quick-xml = "0.41"
lopdf = "0.42"
scraper = "0.22"

# Hashing
blake3 = "1.5"

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP (for server and client mode)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Testing
tempfile = "3.12"
assert_fs = "1.1"
predicates = "3.1"

[profile.release]
debug = 1  # Line tables only — small binary size increase, useful backtraces

[profile.test]
debug = 1
