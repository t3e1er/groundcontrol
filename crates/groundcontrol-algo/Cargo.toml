[package]
name = "groundcontrol-algo"
description = "Standalone per-algorithm retrieval library and CLI for groundcontrol. Enables direct algorithm benchmarking and ablation from external harnesses via Cargo path dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "gc-algo"
path = "src/bin/gc_algo.rs"

[lib]
name = "groundcontrol_algo"
path = "src/lib.rs"

[dependencies]
groundcontrol-common = { path = "../groundcontrol-common" }
groundcontrol-core = { path = "../groundcontrol-core" }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
