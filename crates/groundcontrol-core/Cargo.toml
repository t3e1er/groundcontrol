[package]
name = "groundcontrol-core"
description = "Core engine: indexing, search, graph, embeddings, persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
groundcontrol-common = { path = "../groundcontrol-common" }

# Async
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
sysinfo = { workspace = true }


# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
postcard = { workspace = true }
bytemuck = { workspace = true }

# Tracing
tracing = { workspace = true }

# Markdown
pulldown-cmark = { workspace = true }

# Search
tantivy = { workspace = true }

# Vector search
hnsw_rs = { workspace = true }

# Embeddings & Hardware Acceleration
tokenizers = { workspace = true }

# Graph
petgraph = { workspace = true }

# Database
rusqlite = { workspace = true }

# File watching / locking / filtering
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
fs4 = { workspace = true }
ignore = { workspace = true }

# Compression / Packaging
tar = { workspace = true }
zstd = { workspace = true }

# Hashing
blake3 = { workspace = true }

# AST Code Parsing (Polyglot)
tree-sitter = "0.27"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "=0.6.0"
tree-sitter-elixir = "0.3"
tree-sitter-lua = "=0.2.0"
tree-sitter-bash = "0.23"
# Expanded Grammars
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.26"
tree-sitter-zig = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-sequel = "0.3"
tree-sitter-yaml = "0.7"
tree-sitter-containerfile = "0.9"
tree-sitter-proto = "0.6"
tree-sitter-solidity = "1.2"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-ocaml = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-make = "1.1"
tree-sitter-julia = "0.23"
tree-sitter-graphql = "0.2"
tree-sitter-r = "1.3"
tree-sitter-hcl = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-cuda = "0.21"
tree-sitter-verilog = "1.0"
tree-sitter-tlaplus = "1.5"
tree-sitter-starlark = "1.3"
tree-sitter-bicep = "1.1"
tree-sitter-gleam = "1.0"
tree-sitter-powershell = "0.26"
tree-sitter-d = "0.8"
tree-sitter-wgsl-bevy = "0.1.4"


# SCIP Code Intelligence & Ingestion
scip = "0.10"
protobuf = "3.7"

# Document Extraction (Pure Rust)
quick-xml = { workspace = true }
zip = { workspace = true }
lopdf = { workspace = true }
scraper = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

[features]
default = []


[dev-dependencies]
tempfile = { workspace = true }
assert_fs = { workspace = true }

[[bin]]
name = "test_decompose"
path = "src/bin/test_decompose.rs"

[[bin]]
name = "run_benchmark"
path = "src/bin/run_benchmark.rs"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml", "copy-dylibs", "download-binaries"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["coreml", "copy-dylibs", "download-binaries"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["copy-dylibs", "download-binaries"] }
