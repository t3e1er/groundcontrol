# ==============================================================================
# ctxvault Local Repository Configuration
# ==============================================================================
name = "ctxvault"
path = "."
mode = "read-write"
index_mode = "full"

[docs]
# Glob patterns promoting rich non-markdown files (.html, .pdf, .docx) to doc projections
# (Native *.md files are always documentation notes; code files are auto-discovered)
patterns = [
    "docs/**",
    "wiki/**",
    "architecture/**"
]

[exclude]
# Explicit file and directory exclusion patterns (gitignore syntax)
# Seeded from .gitignore during initialization; this list is the single source of truth.
patterns = [
    "target/**",
    "dist/**",
    "build/**",
    "out/**",
    "bin/**",
    ".venv/**",
    "venv/**",
    "__pycache__/**",
    "tests/**",
    "test/**",
    "*.test.*",
    "*.spec.*",
    "*.exe",
    "*.dll",
    "*.so",
    "*.dylib",
    "*.wasm"
]

[templates]
dir = "docs/.templates"

[chunking]
strategy = "heading"
target_tokens = 512
max_tokens = 1024
min_chunk_tokens = 50
overlap_tokens = 64
respect_headings = true

[[graph.edge_types]]
name = "Wikilink"
source = "wikilink"
weight = 1.0
bidirectional = false
class = "structural"

[[graph.edge_types]]
name = "SharedTag"
source = "tag"
weight = 0.5
bidirectional = true
max_frequency = 50
class = "semantic"

[[graph.edge_types]]
name = "ParentChild"
source = "frontmatter"
field = "parent"
weight = 1.0
direction = "inbound"
class = "structural"

[[graph.edge_types]]
name = "Supersedes"
source = "frontmatter"
field = "supersedes"
weight = 1.0
direction = "outbound"
class = "semantic"

[[graph.edge_types]]
name = "DerivedFrom"
source = "frontmatter"
field = "derived_from"
weight = 0.9
direction = "outbound"
class = "semantic"

[[graph.edge_types]]
name = "Implements"
source = "frontmatter"
field = "implements"
weight = 0.8
direction = "outbound"
class = "crossmodal"

[[graph.edge_types]]
name = "Related"
source = "frontmatter"
field = "related"
weight = 0.7
bidirectional = true
class = "semantic"
