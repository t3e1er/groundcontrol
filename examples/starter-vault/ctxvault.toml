# ==============================================================================
# Starter Vault Local Repository Configuration
# ==============================================================================
name = "starter-vault"
path = "."
mode = "read-write"
index_mode = "full"

[docs]
patterns = [
    "docs/**",
    "wiki/**"
]

[exclude]
patterns = [
    "target/**",
    ".git/**",
    ".index/**"
]

[templates]
dir = ".templates"

[chunking]
strategy = "semantic"
target_tokens = 512
max_tokens = 1024
overlap_tokens = 64
respect_headings = true
min_chunk_tokens = 50

[embedding]
model = "all-MiniLM-L6-v2"
dimensions = 384
quantization = "f32"

[[graph.edge_types]]
name = "Wikilink"
source = "wikilink"
weight = 1.0
bidirectional = false
description = "Direct [[wikilink]] reference between documents"

[[graph.edge_types]]
name = "SharedTag"
source = "tag"
weight = 0.5
bidirectional = true
max_tag_frequency = 15
description = "Shared thematic hashtag relation"

[[graph.edge_types]]
name = "ParentChild"
source = "frontmatter"
field = "parent"
weight = 1.0
direction = "inbound"
description = "Hierarchical parent to child relationship"

[[graph.edge_types]]
name = "Supersedes"
source = "frontmatter"
field = "supersedes"
weight = 1.0
direction = "outbound"
description = "Indicates this decision supersedes a previous ADR"

[[graph.edge_types]]
name = "Implements"
source = "frontmatter"
field = "implements"
weight = 0.8
direction = "outbound"
description = "Implementation link between concept and concrete decision"

[[graph.edge_types]]
name = "DerivedFrom"
source = "frontmatter"
field = "derived_from"
weight = 0.9
direction = "outbound"
description = "Principle 3 provenance link from episodic log to crystallized concept"
